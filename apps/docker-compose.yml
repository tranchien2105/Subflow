
services:
  postgres:
    image: postgres:16-alpine
    container_name: subflow-postgres
    environment:
      POSTGRES_DB: subflow
      POSTGRES_USER: subflow
      POSTGRES_PASSWORD: subflow_local_dev
    ports:
      - "5433:5432"
    volumes:
      - subflow_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U subflow -d subflow"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: subflow-redis
    ports:
      - "6380:6379"
    volumes:
      - subflow_redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  subflow_postgres_data:
  subflow_redis_data:
